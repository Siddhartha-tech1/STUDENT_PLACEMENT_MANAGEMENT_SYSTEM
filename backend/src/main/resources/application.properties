spring.application.name=student-placement-management-system
server.port=${PORT:${SERVER_PORT:8081}}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/student_placement_db}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-production-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.resume.storage-dir=${RESUME_STORAGE_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=${MAX_RESUME_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_RESUME_SIZE:5MB}

app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Placement Administrator}
