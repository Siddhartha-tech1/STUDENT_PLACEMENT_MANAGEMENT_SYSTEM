services:
  - type: web
    runtime: docker
    name: spms-api
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/options
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RESUME_STORAGE_DIR
        value: /tmp/uploads/resumes
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Placement Administrator

  - type: web
    runtime: static
    name: spms-frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
